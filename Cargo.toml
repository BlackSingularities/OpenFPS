[package]
name = "openfps"
version = "1.0.0"
edition = "2021"
description = "Lightweight, highly customizable FPS & system overlay for Windows"
license = "MIT"

[[bin]]
name = "openfps"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
# Integracje z redzikowski.com (zgłoszenia, aktualizacje) — używane tylko na żądanie.
ureq = "2"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.58"
features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Devices_Display",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_Com",
  "Win32_System_Time",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
